const e5=o=>`(a ${o} b)ⁿ repite el paréntesis n veces, multiplicándolo por sí mismo. Al reagrupar, todas las a se juntan por un lado y todas las b por otro. `,e5r=o=>`Se repiten las a y las b n veces cada una, se emparejan en paréntesis (a ${o} b) y se recogen como (a ${o} b)ⁿ. `;
const S={
1:{t:'Definición de potencia',v:[R([Q(A,N),`${A} · ${A} · … · ${A}`,'(n veces)'],'El exponente n indica cuántas veces se multiplica la base a por sí misma. n puede ser 2, 3, 10… por eso se escribe con puntos suspensivos.','2⁴ = 2 · 2 · 2 · 2 = 16',s1)]},
2:{t:'Potencia de exponente 1',v:[R([Q(A,'1'),A],'Con exponente 1 solo hay un factor: la potencia es la propia base.','9¹ = 9',s2)]},
3:{t:'Potencia de exponente 0',v:[R([`${Q(A,N)} : ${Q(A,N)}`,`${Q(A,'0')} = 1`,'(con a ≠ 0)'],'Dividir aⁿ entre sí misma da 1, y por la regla de la misma base da aⁿ⁻ⁿ = a⁰. Cada factor del dividendo se cancela con uno del divisor.','7⁰ = 1',s3)]},
4:{t:'Potencia con base negativa',v:[R([Q(NG,N),`${PL}${Q(A,N)}`,'(si n es par)'],'Los factores (−a) se multiplican: (−a) · (−a) · … · (−a). Se agrupan de dos en dos y cada pareja da +. Con n par no sobra ninguno: el resultado es positivo.','(−2)⁴ = +16',s4f(4),'n par'),R([Q(NG,N),`${MI}${Q(A,N)}`,'(si n es impar)'],'Los factores (−a) se multiplican: (−a) · (−a) · … · (−a). Se agrupan de dos en dos, pero con n impar sobra uno: el resultado es negativo.','(−2)³ = −8',s4f(3),'n impar')]},
5:{t:'Producto y división con el mismo exponente',v:[R([Q(pa('·'),N),pw('·')],e5('·'),'(4 · 3)² = 4² · 3² = 12²',s5f('·'),'(a·b)ⁿ → aⁿ·bⁿ','Multiplicación'),R([pw('·'),Q(pa('·'),N)],e5r('·'),'4² · 3² = (4 · 3)² = 12²',s5r('·'),'aⁿ·bⁿ → (a·b)ⁿ','Multiplicación'),R([Q(pa(':'),N),pw(':')],e5(':'),'(8 : 2)³ = 8³ : 2³ = 4³',s5f(':'),'(a:b)ⁿ → aⁿ:bⁿ','División'),R([pw(':'),Q(pa(':'),N)],e5r(':'),'8³ : 2³ = (8 : 2)³ = 4³',s5r(':'),'aⁿ:bⁿ → (a:b)ⁿ','División')]},
6:{t:'Producto y división con la misma base',v:[R([`${Q(A,N)} · ${Q(A,M)}`,Q(A,`${N}+${M}`)],'aⁿ aporta n factores a y aᵐ aporta m factores a. Al multiplicarlos hay n + m factores iguales.','2³ · 2⁴ = 2⁷',s6,'Multiplicación'),R([`${Q(A,N)} : ${Q(A,M)}`,Q(A,`${N}−${M}`),'(con n ≥ m)'],'Se cancelan m factores del dividendo con los m del divisor. Quedan n − m factores.','5⁶ : 5² = 5⁴',s6d,'División')]},
7:{t:'Potencia de una potencia',v:[R([Q(`(${Q(A,N)})`,M),Q(A,`${N}·${M}`)],'(aⁿ)ᵐ repite aⁿ m veces, multiplicándola por sí misma. Con la misma base se suman los exponentes: m sumandos iguales a n, es decir, n · m.','(3²)⁴ = 3⁸',s7)]},
8:{t:'Exponente negativo',v:[R([Q(A,`−${N}`),`${FR(1,Q(A,N))}`],'Escribimos −n como 0 − n: restar exponentes es dividir potencias, y a⁰ = 1. Queda 1 dividido entre aⁿ.','2⁻³ = 1/2³ = 1/8',s8)]},
9:{t:'Exponente fraccionario',v:[R([Q(A,FR(1,N)),RD(N,A)],'Un exponente 1/n es una raíz de índice n. El denominador n pasa a ser el índice.','8^(1/3) = ∛8 = 2',s9f(0),'Exponente 1/n'),R([Q(A,FR(M,N)),RD(N,Q(A,M))],'En m/n, el denominador n es el índice de la raíz y el numerador m es el exponente del radicando.','4^(3/2) = √(4³) = √64 = 8',s9f(1),'Exponente m/n')]}};
const B=['aⁿ','a¹','a⁰','(−a)ⁿ','(a·b)ⁿ','aⁿ·aᵐ','(aⁿ)ᵐ','a⁻ⁿ','a<sup>m/n</sup>'];
let cur=1,vi=0,P=0,dir=0,raf=null;const $=s=>document.querySelector(s);
B.forEach((h,i)=>{const e=document.createElement('button');e.innerHTML=h;e.onclick=()=>go(i+1);$('#nav').append(e)});
function go(k,j=0){cur=k;vi=j;stop();P=0;const V=S[k].v,v=V[j];
document.querySelectorAll('#nav button').forEach((b,i)=>b.classList.toggle('on',i+1==k));
const gps=[...new Set(V.map(u=>u.gp).filter(Boolean))];let h='';
if(gps.length){const g=V[j].gp,z=V.length/gps.length;h=gps.map((n,i)=>`<button class="${n==g?'on':''}" onclick="go(${k},${i*z+j%z})">${n}</button>`).join('')+'<span class="br"></span>'+V.map((u,i)=>u.gp==g?`<button class="${i==j?'on':''}" onclick="go(${k},${i})">${u.l}</button>`:'').join('')}
else if(V.length>1)h=V.map((u,i)=>`<button class="${i==j?'on':''}" onclick="go(${k},${i})">${u.l}</button>`).join('');
$('#vs').innerHTML=h;
$('#tt').textContent=S[k].t;$('#pr').innerHTML=prop(v.f);$('#em').textContent=v.e;$('#ex').textContent=v.x;draw()}
function draw(){x.globalAlpha=1;x.clearRect(0,0,W,H);x.textAlign='center';x.textBaseline='middle';S[cur].v[vi].d(P);
$('#sl').value=P*100;$('#pc').textContent=Math.round(P*100)+'%'}
function stop(){dir=0;cancelAnimationFrame(raf);$('#pl').textContent='▶'}
function tick(){P=cl(P+dir*.004);draw();if(P>=1||P<=0)stop();else raf=requestAnimationFrame(tick)}
$('#pl').onclick=()=>{if(dir){stop();return}dir=P>=1?-1:1;$('#pl').textContent='⏸';tick()};
$('#rs').onclick=()=>{stop();P=0;draw()};
$('#sl').oninput=e=>{stop();P=e.target.value/100;draw()};
go(1);
</script></body></html>
